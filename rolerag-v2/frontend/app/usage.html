<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121613">
  <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml">
  <title>用量 · StoryRole</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page">
        <header class="page-header">
          <div>
            <h1 class="page-title">用量</h1>
            <p class="page-desc">这里只统计当前账号的调用。数据来自每一次真实模型请求，不混入其他账号或全局缓存。</p>
          </div>
          <div class="header-actions">
            <select class="select" id="usage-range" aria-label="统计范围">
              <option value="7">近 7 天</option>
              <option value="30" selected>近 30 天</option>
              <option value="90">近 90 天</option>
            </select>
          </div>
        </header>
        <div class="metric-grid" id="metric-grid">
          <div class="metric-card card"><div class="skeleton" style="height:60px"></div></div>
          <div class="metric-card card"><div class="skeleton" style="height:60px"></div></div>
          <div class="metric-card card"><div class="skeleton" style="height:60px"></div></div>
          <div class="metric-card card"><div class="skeleton" style="height:60px"></div></div>
        </div>
        <div class="usage-grid" style="margin-top:15px">
          <section class="card card-pad">
            <div class="section-head"><h2 class="section-title">每日调用</h2><span class="pill" id="daily-note">—</span></div>
            <div class="sparkline" id="daily-chart" style="height:76px"></div>
            <div class="row" style="margin-top:8px"><span class="faint" style="font-size:9px" id="daily-start"></span><span class="spacer"></span><span class="faint" style="font-size:9px">今天</span></div>
          </section>
          <section class="card card-pad">
            <div class="section-head"><h2 class="section-title">调用构成</h2><span class="faint" style="font-size:10px">按 agent / 操作</span></div>
            <div id="agent-bars"><div class="skeleton" style="height:80px"></div></div>
          </section>
        </div>
        <section class="card card-pad" style="margin-top:15px">
          <div class="section-head"><h2 class="section-title">最近调用</h2><span class="faint" style="font-size:10px">最多显示 12 条</span></div>
          <div style="overflow-x:auto" id="recent-table-wrap">
            <table class="data-table" id="recent-table">
              <colgroup><col style="width:20%"><col style="width:22%"><col style="width:20%"><col style="width:12%"><col style="width:12%"><col style="width:14%"></colgroup>
              <thead><tr><th>操作</th><th>模型</th><th>角色 / 模块</th><th>Token</th><th>耗时</th><th>时间</th></tr></thead>
              <tbody><tr><td colspan="6"><div class="skeleton" style="height:80px"></div></td></tr></tbody>
            </table>
          </div>
          <div class="empty-state hidden" id="usage-empty" style="min-height:220px;margin-top:14px">
            <h3>这个范围内还没有调用</h3>
            <p>去开始一段对话，或使用一次工具。这里会自动记录当前账号的真实调用。</p>
            <a class="btn btn-primary" href="/chats">去对话</a>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="/static/app/common.js"></script>
  <script src="/static/app/usage.js"></script>
</body>
</html>
