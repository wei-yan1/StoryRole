<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121613">
  <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml">
  <title>登录 · StoryRole</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual">
      <div class="auth-copy">
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="m19 16 .9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16Z"/></svg>
          </span>
          <span class="auth-brand-name">StoryRole</span>
        </div>
        <h1 class="auth-display">和角色，<br><em>认真聊一聊。</em></h1>
        <p class="auth-sub">把资料里的名字变成可以对话的人。选择一个角色，进入一段只属于你们的对话；不需要记住复杂的档案结构。</p>
        <div class="auth-chat-demo" aria-hidden="true">
          <div class="demo-message">
            <span class="avatar avatar-sm" style="background:linear-gradient(145deg,#d9a15e,#7d4f2a)">罗</span>
            <span class="demo-bubble">你来了。坐吧，窗边还有一点位置。</span>
          </div>
          <div class="demo-message is-user">
            <span class="demo-bubble">最近总觉得，很多选择都没有标准答案。</span>
          </div>
          <div class="demo-message">
            <span class="avatar avatar-sm" style="background:linear-gradient(145deg,#6e9b86,#2d5547)">程</span>
            <span class="demo-bubble">没有标准答案，不代表不能认真选择。</span>
          </div>
        </div>
      </div>
      <footer class="auth-foot">
        <span>对话优先</span><span>角色独立</span><span>数据可追溯</span>
      </footer>
    </section>

    <section class="auth-form-side">
      <div class="auth-form-wrap">
        <h2 id="auth-title">欢迎回来</h2>
        <p class="lead" id="auth-lead">登录后继续你的对话。</p>
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab is-current" type="button" data-auth-tab="login">登录</button>
          <button class="auth-tab" type="button" data-auth-tab="register">创建账号</button>
        </div>
        <form class="auth-form" id="auth-form" autocomplete="on">
          <div class="field">
            <label class="field-label" for="auth-username">账号</label>
            <input class="input" id="auth-username" name="username" autocomplete="username" minlength="2" maxlength="64" required placeholder="输入你的用户名">
          </div>
          <div class="field">
            <label class="field-label" for="auth-password">密码</label>
            <input class="input" id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="至少 8 位">
          </div>
          <div class="auth-error" id="auth-error" role="alert"></div>
          <button class="btn btn-primary btn-lg" id="auth-submit" type="submit">登录</button>
        </form>
        <p class="auth-note">账号只用于保存你的角色、资料和对话。聊天内容与上传文件仅属于当前账号。</p>
      </div>
    </section>
  </main>
  <script src="/static/app/common.js"></script>
  <script src="/static/app/login.js"></script>
</body>
</html>
