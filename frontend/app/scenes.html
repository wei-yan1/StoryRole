<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121613">
  <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml">
  <title>场景 · StoryRole</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page scenes-page">
        <a class="back-link" href="/characters" id="back-to-character"></a>
        <header class="page-header">
          <div>
            <h1 class="page-title">场景</h1>
            <p class="page-desc" id="scene-subtitle">每个场景是角色的一段人生。选一个阶段，准备人设后就能进入对话。</p>
          </div>
          <div class="scene-header-actions">
            <button class="text-link" type="button" id="analyze-button">从原文整理场景</button>
            <button class="btn btn-primary" type="button" id="add-scene-button">添加场景</button>
          </div>
        </header>
        <p class="toolbar-note" id="analysis-note" role="status" style="min-height:16px"></p>
        <div class="scene-workbench">
          <section class="scene-pane scene-list-pane" aria-labelledby="scene-list-title">
            <div class="scene-pane-head">
              <h2 id="scene-list-title">场景列表</h2>
              <p id="scene-count">0 个</p>
            </div>
            <div id="scene-list" class="scene-rail-list"></div>
          </section>
          <section class="scene-pane scene-content-pane" id="scene-detail">
            <div class="scene-empty" id="scene-detail-empty">
              <h2>选择一个场景</h2>
              <p>每个场景是角色经历中的一个阶段。准备人设之后，这个场景才可以在对话中使用。</p>
            </div>
            <div id="scene-detail-content" class="hidden"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/app/common.js"></script>
  <script src="/static/app/scenes.js"></script>
</body>
</html>
