<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121613">
  <link rel="icon" href="/static/app/favicon.svg" type="image/svg+xml">
  <title>对话 · StoryRole</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page chats-page">
        <header class="page-header">
          <div>
            <h1 class="page-title">对话</h1>
            <p class="page-desc">从最近一段继续。点一行就能回到你和这个角色的对话。</p>
          </div>
          <div class="header-actions">
            <a class="btn btn-primary btn-lg" href="/chats/new"><span id="new-chat-icon"></span>新对话</a>
          </div>
        </header>

        <div class="list-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input class="input" id="conversation-search" placeholder="搜索角色或对话内容" aria-label="搜索对话">
          </div>
          <span class="toolbar-note" id="inbox-stat">正在加载</span>
        </div>

        <section aria-labelledby="conversation-list-title" style="margin-top:18px">
          <div class="section-head">
            <h2 class="section-title" id="conversation-list-title">最近对话</h2>
          </div>
          <div class="inbox-list" id="conversation-list">
            <div class="skeleton" style="height:74px"></div>
            <div class="skeleton" style="height:74px"></div>
            <div class="skeleton" style="height:74px"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="/static/app/common.js"></script>
  <script src="/static/app/chats.js"></script>
</body>
</html>
